<!-- GLB検証ページ: 書き出した sofa.glb を GLTFLoader で読み込んで表示 -->
<meta charset="utf-8">
<style>html,body{margin:0;background:#f5f5f5}</style>
<script type="importmap">
{
  "imports": {
    "three": "/build/node_modules/three/build/three.module.js",
    "three/addons/": "/build/node_modules/three/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const SIZE = 900;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(SIZE, SIZE);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf5f5f5);
scene.add(new THREE.HemisphereLight(0xffffff, 0xd8d8d8, 1.1));
const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(2.5, 5, 4);
scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.5);
fill.position.set(-3, 2, -2);
scene.add(fill);

const camera = new THREE.PerspectiveCamera(20, 1, 0.1, 100);
camera.position.set(3.2, 1.3, 4.2);
camera.lookAt(0, 0.42, 0);

new GLTFLoader().load('/sofa.glb', (gltf) => {
  scene.add(gltf.scene);
  renderer.render(scene, camera);
  const meshes = [];
  gltf.scene.traverse((o) => { if (o.isMesh) meshes.push(o.name); });
  window.RESULT = { meshes, shot: renderer.domElement.toDataURL('image/png') };
}, undefined, (e) => { window.RESULT = { error: String(e) }; });
</script>
